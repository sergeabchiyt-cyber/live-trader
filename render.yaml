# Render blueprint for the FRVP PoC live trader (web service).
#
# Deploy: Render dashboard -> "New +" -> "Blueprint" -> pick this repo.
# After the service is created, fill in the two secrets (BINANCE_API_KEY /
# BINANCE_API_SECRET) in the Render dashboard Env tab, then Deploy.
#
# Architecture on Render (Binance blocks datacenter IPs — HTTP 418 — from its
# MAINNET futures endpoints; spot *.binance.vision public data is exempt):
#   * MARKET DATA  (DATA_VENUE=bybit): real XAUUSDT gold-perp klines from
#     Bybit's public v5 REST API (api.bybit.com, no keys, poll every POLL_S).
#     Volume profile weighted by real traded volume.
#   * ORDERS (VENUE=futures, MODE=testnet): Binance USDT-M FUTURES TESTNET
#     (testnet.binancefuture.com — keys SEPARATE from the spot testnet, get
#     them at https://testnet.binancefuture.com): LIMIT entries, reduceOnly
#     STOP_MARKET SL + TAKE_PROFIT_MARKET TP, leverage 1x.
#   * Alternatives: DATA_VENUE=futures (Binance futures testnet data — synthetic
#     volume) or DATA_VENUE=spot SYMBOL=PAXGUSDT (tokenized gold, real spot
#     data via data-api.binance.vision; spot testnet can't trade it).
#
# Do NOT set PORT: Render injects it and the app binds to it automatically.

services:
  - type: web
    name: live-trader
    runtime: python
    plan: free
    region: frankfurt  # choose a region whose IPs Binance/Bybit do not geo-block
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m live.run
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      # runtime
      - key: PYTHONUNBUFFERED
        value: "1"          # live logs on Render (no stdout buffering)
      - key: FEED
        value: rest         # bybit data venue is REST-poll by design
      - key: POLL_S
        value: "5"
      # data venue + mode + order routing
      - key: DATA_VENUE
        value: bybit        # bybit (real XAUUSDT perp data) | spot | futures
      - key: VENUE
        value: futures      # order routing: futures (USDT-M perp) | spot
      - key: MODE
        value: testnet
      - key: BINANCE_TESTNET
        value: "1"
      - key: BINANCE_DRY_RUN
        value: "0"          # 0 = actually send orders to the futures testnet
      - key: BINANCE_API_KEY
        sync: false         # fill in Render dashboard (FUTURES testnet key)
      - key: BINANCE_API_SECRET
        sync: false         # fill in Render dashboard (FUTURES testnet secret)
      # strategy / instrument
      - key: SYMBOL
        value: XAUUSDT      # gold perp (data: Bybit; orders: Binance f-testnet)
      - key: POSITION_USD
        value: "20"
      - key: RR
        value: "2.0"
      - key: SKIP_HOUR0
        value: "1"
      - key: SAME_BAR
        value: "1"
