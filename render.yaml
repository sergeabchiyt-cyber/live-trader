# Render blueprint for the FRVP PoC live trader (web service).
#
# Deploy: Render dashboard -> "New +" -> "Blueprint" -> pick this repo.
# After the service is created, fill in the two secrets (BINANCE_API_KEY /
# BINANCE_API_SECRET) in the Render dashboard Env tab, then Deploy.
#
# VENUE=futures: market data = XAUUSDT TRADFI gold perpetual from the PUBLIC
# USDT-M futures endpoints (fapi/fstream.binance.com, no keys). Orders go to
# the Binance USDT-M FUTURES TESTNET (testnet.binancefuture.com) — its keys are
# SEPARATE from the spot testnet (get them at https://testnet.binancefuture.com).
# XAUUSDT does not exist on Binance spot; on spot use SYMBOL=PAXGUSDT.
# The strategy itself is symbol/venue-agnostic (OHLCV + #trades).
#
# Do NOT set PORT: Render injects it and the app binds to it automatically.

services:
  - type: web
    name: live-trader
    runtime: python
    plan: free
    region: frankfurt  # choose a region whose IPs Binance does not geo-block
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m live.run
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      # runtime
      - key: PYTHONUNBUFFERED
        value: "1"          # live logs on Render (no stdout buffering)
      - key: FEED
        value: ws           # ws (default, push) | rest (polling fallback)
      - key: POLL_S
        value: "5"
      # venue + mode + order routing (USDT-M futures testnet)
      - key: VENUE
        value: futures      # futures (XAUUSDT perp) | spot (PAXGUSDT)
      - key: MODE
        value: testnet
      - key: BINANCE_TESTNET
        value: "1"
      - key: BINANCE_DRY_RUN
        value: "0"          # 0 = actually send orders to the futures testnet
      - key: BINANCE_API_KEY
        sync: false         # fill in Render dashboard (FUTURES testnet key)
      - key: BINANCE_API_SECRET
        sync: false         # fill in Render dashboard (FUTURES testnet secret)
      # strategy / instrument
      - key: SYMBOL
        value: XAUUSDT      # gold TRADFI perp (USDT-M); lot precision 0.001
      - key: POSITION_USD
        value: "20"
      - key: RR
        value: "2.0"
      - key: SKIP_HOUR0
        value: "1"
      - key: SAME_BAR
        value: "1"
