# Render blueprint for the FRVP live trader v2 (Rust).
#
# Fresh deploys: this blueprint builds a Docker image that runs the prebuilt
# static musl binary committed at bin/live-trader-x86_64 (~20MB image,
# zero-compile deploys). Dockerfile.build is the compile-from-source variant.
#
# NOTE — the existing production service (live-trader-pxjv.onrender.com) was
# created in 2026-09 with runtime: python, BEFORE this rewrite, and was
# switched to runtime: docker via the Update-service API
# (serviceDetails.runtime), keeping its original URL and env vars.
#
# Architecture:
#   * MARKET DATA (DATA_VENUE=bybit): XAUUSDT gold-perp klines from Bybit's
#     public v5 REST API (no keys), 5s poll for bars + 1s ticker poll for
#     live ticks. Volume profile weighted by real traded volume.
#   * STRATEGY: FRVP PoC engine (session mean-reversion to prior-session
#     value), 15m bars, engine-identical math (parity-tested).
#   * LEDGER: fee-aware paper accounting (Bybit maker/taker), risk-based
#     sizing shared with the order mirror (AUDIT.md fixes A1/A3).
#   * ORDERS (VENUE=futures, MODE=testnet): Binance USDT-M futures testnet —
#     LIMIT entries, reduceOnly STOP_MARKET SL + TAKE_PROFIT_MARKET TP.
#   * KEEP-ALIVE: free-tier services sleep after 15 min without inbound
#     traffic — point an uptime pinger at /api/ping (AUDIT.md B1).

services:
  - type: web
    name: live-trader
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: DATA_VENUE
        value: bybit
      - key: SYMBOL
        value: XAUUSDT
      - key: VENUE
        value: futures
      - key: MODE
        value: testnet
      - key: BINANCE_TESTNET
        value: "1"
      - key: BINANCE_DRY_RUN
        value: "0"          # 0 = actually send orders to the futures testnet
      - key: BINANCE_API_KEY
        sync: false         # fill in Render dashboard (FUTURES testnet key)
      - key: BINANCE_API_SECRET
        sync: false         # fill in Render dashboard (FUTURES testnet secret)
      - key: RR
        value: "2.0"
      - key: SKIP_HOUR0
        value: "1"
      - key: SAME_BAR
        value: "1"
      - key: SL_MODE
        value: touch        # touch = exchange-realistic fills (close = legacy)
      - key: FEE_MAKER_PCT
        value: "0.02"       # Bybit perp base tier
      - key: FEE_TAKER_PCT
        value: "0.055"
      - key: RISK_PCT
        value: "0.5"        # % of paper equity risked per trade
      - key: LEVERAGE_CAP
        value: "3.0"        # notional cap = 3x paper equity
      - key: POLL_S
        value: "5"
