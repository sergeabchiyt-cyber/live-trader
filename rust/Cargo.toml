[package]
name = "frvp-core"
version = "0.1.0"
edition = "2021"
description = "Low-latency FRVP PoC gold strategy core (Rust) — mirrors the validated Python engine exactly"

[[bin]]
name = "frvp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
