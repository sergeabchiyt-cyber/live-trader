[package]
name = "live-trader"
version = "2.0.0"
edition = "2021"
description = "FRVP PoC gold trader — Rust service: Bybit/Binance feed, strategy engine, fee-aware paper ledger, Binance order mirror, HTTP + WebSocket push, embedded terminal dashboard"
license = "MIT"

[[bin]]
name = "live-trader"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ring = "0.17"
